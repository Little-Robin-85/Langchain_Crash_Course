[project]
name = "langchain-gemini-crash-course"
version = "0.1.0"
description = "LangChain Crash Course recreated for Google Gemini models with verbose educational commentary."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "google-genai>=2.22.0",
    "langgraph>=1.2.11",
    "langchain-community>=0.4.0",
    "faiss-cpu>=1.15.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pydantic>=2.10.0",
    "pillow>=10.0.0",
]

[tool.uv]
managed = true
